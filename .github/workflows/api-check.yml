name: XORA API checks
on:
  push:
    branches: [main, "feat/**"]
    paths: ["server/**", ".github/workflows/api-check.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/api-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run check
      - run: npm test
