name: Validate XORA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check JavaScript syntax
        run: node --check xora/app.js
      - name: Validate manifest JSON
        run: python -m json.tool xora/manifest.json > /dev/null
      - name: Check local page links and manifest icons
        run: python scripts/validate_site.py
